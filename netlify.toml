# Netlify 部署配置（纯静态，无构建步骤）
# 直接把这个目录拖到 Netlify，或者连 Git 仓库都能用
[build]
  publish = "."

# index.html 每次都要回源校验：游戏更新后玩家刷新就能拿到新版
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# 模型/贴图这类静态素材内容不变，放心长缓存（文件名变了浏览器才会重新拉）
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# 兜底安全头
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
